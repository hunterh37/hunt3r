<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUNT3R</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0a0a0a; --paper:#f4f2ec; --amber:#ff8a3d; --haze:#9db4c8; }
  html, body { margin:0; background:var(--paper); color:var(--ink); }
  body { overscroll-behavior:none; }
  #gl { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #scroll { height:792vh; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="scroll"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
